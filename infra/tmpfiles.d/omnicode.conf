# OmniCode runtime directory for the agentd socket (design 8.2). Installed to /etc/tmpfiles.d/.
# Pre-created at boot; omnicode-agentd.service (RuntimeDirectory=omnicode, mode 0750) owns it afterwards
# and re-owns it to omniagent:omniagent on start. The socket inside is created by agentd as 0660.
#Type Path           Mode User      Group    Age
d     /run/omnicode  0750 omniagent omnicode -
